[project]
name = "hr-attendance-dashboard"
version = "2.0.0"
description = "HR attendance, payroll & sales performance dashboard for car dealership operations"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit==1.63.0",
    "polars>=1.24.0",
    "pyarrow>=14.0.0",
    "python-calamine>=0.2.0",
    "fastexcel>=0.11.0",
    "openpyxl==3.1.5",
    "xlsxwriter>=3.2.0",
    "plotly==6.5.2",
    "reportlab==4.4.9",
    "xlrd==2.0.2",
]

[tool.pycrucible]
entrypoint = "run_hr_dashboard.py"

[tool.pycrucible.options]
debug = false
extract_to_temp = false
delete_after_run = false
uv_version = "0.9.21"

[tool.pycrucible.patterns]
include = [
    "hrdash/**/*.py",
    "streamlit_app.py",
    "run_hr_dashboard.py",
    "template_cuti_karyawan.xlsx",
]
exclude = [
    "**/__pycache__/**",
    ".git/**",
    ".venv/**",
]
